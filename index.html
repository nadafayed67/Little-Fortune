const cookie = document.getElementById('cookie');
const toggle = document.getElementById('toggle');
const fresh = document.getElementById('new');
const hint = document.getElementById('hint');
const fortuneText = document.getElementById('fortune');
const numberText = document.getElementById('number');
let isOpen = false, current = -1;
function pickFortune(){
  if(fortunes.length < 2) return 0;
  let next;
  do { next = Math.floor(Math.random() * fortunes.length); } while(next === current);
  return next;
}
function openCookie(){
  current = pickFortune();
  fortuneText.textContent = fortunes[current];
  numberText.textContent = String(current + 1).padStart(3,'0') + '  ·  YOUR FORTUNE';
  isOpen = true;
  stage.classList.add('open');
  cookie.setAttribute('aria-expanded','true');
  cookie.setAttribute('aria-label','Close your fortune cookie');
  toggle.textContent = 'Close cookie';
  fresh.hidden = false;
  hint.textContent = 'your little reminder for today';
}
function closeCookie(){
  isOpen = false;
  stage.classList.remove('open');
  cookie.setAttribute('aria-expanded','false');
  cookie.setAttribute('aria-label','Open your fortune cookie');
  toggle.textContent = 'Open my fortune';
  fresh.hidden = true;
  hint.textContent = 'tap the cookie to open your fortune';
}
function toggleCookie(){ if(isOpen) closeCookie(); else openCookie(); }
cookie.addEventListener('click', toggleCookie);
toggle.addEventListener('click', toggleCookie);
fresh.addEventListener('click', () => {
  if (!isOpen) return;
  current = pickFortune();
  fortuneText.textContent = fortunes[current];
  numberText.textContent = String(current + 1).padStart(3,'0') + '  ·  YOUR FORTUNE';
